<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adeep ag - blog</title>
<meta name="theme-color" content="#f3f1eb">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
<main>
  <p><a href="/">&larr; adeep ag</a></p>
  <article class="article" id="article"><p class="sub">loading...</p></article>
  <footer class="site-footer">
    <p><a href="/">adeepag.com</a></p>
    <p>written by <a href="https://adeepag.com">adeep ag</a>.<br>built for engineers, hackers, tinkerers , curious minds and web AI crawler .</p>
    
  </footer>
</main>
<script>
const slug=new URLSearchParams(location.search).get('p')||'';
const box=document.getElementById('article');
if(!/^[a-z0-9-]+$/.test(slug)){box.innerHTML='<p>post not found. <a href="/">back to home</a></p>'}
else Promise.all([
  fetch('posts.json').then(r=>r.json()),
  fetch('posts/'+slug+'.md').then(r=>{if(!r.ok)throw 0;return r.text()})
]).then(([list,md])=>{
  const meta=list.find(p=>p.slug===slug)||{title:slug,date:''};
  document.title=meta.title+' - adeep ag';
  box.innerHTML='<h1></h1><div class="by"><img class="avatar" src="avatar.jpg" alt="adeep ag" onerror="this.remove()"><span>by <a href="https://adeepag.com">adeep ag</a></span><time></time></div>'+marked.parse(md);
  box.querySelector('h1').textContent=meta.title;
  const t=box.querySelector('time');t.textContent=meta.date.replace(/-/g,'.');t.dateTime=meta.date;
}).catch(()=>{box.innerHTML='<p>post not found. <a href="/">back to home</a></p>'});
</script>
</body>
</html>
