<style>
@font-face {
  font-family: 'Hey Gotcha';
  src: url('../fonts/HeyGotcha-Regular.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'Horiza';
  src: url('../fonts/Horizon.woff2') format('woff2'),
       url('../fonts/Horizon.otf') format('opentype');
  font-display: swap;
}

:root {
  --bg: #ffffff;
  --bg-soft: #fafafa;
  --text: #000000;
  --text-body: #333333;
  --text-muted: #666666;
  --border: #000000;
  --accent: #2788c7;
  --accent-soft: #eaf4fb;
  --tag-bg: #f2f2f2;
  --card-bg: #ffffff;
  --nav-h: 58px;
}
html.dark {
  --bg: #14171a;
  --bg-soft: #1b1f23;
  --text: #f2f2f2;
  --text-body: #cfcfcf;
  --text-muted: #9aa0a6;
  --border: #f2f2f2;
  --accent: #5fb3ec;
  --accent-soft: #1d2c36;
  --tag-bg: #23272b;
  --card-bg: #1b1f23;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Comic Sans MS', 'Comic Sans', 'Comic Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

/* ── Nav ── */
.nav {
  position: sticky; top: 0; z-index: 50;
  height: var(--nav-h);
  background: var(--bg);
  border-bottom: 2px solid var(--border);
  display: flex; align-items: center;
  padding: 0 24px; gap: 16px;
  transition: background 0.2s, border-color 0.2s;
}
.nav-brand {
  font-family: 'Arvo', serif; font-weight: 700;
  font-size: 20px; letter-spacing: -0.3px; flex-shrink: 0;
}
.nav-brand .dot { color: var(--accent); }
.nav-search {
  flex: 1; max-width: 280px; margin: 0 auto; position: relative;
}
.nav-search input {
  width: 100%; padding: 7px 14px 7px 36px;
  border: 2px solid var(--border); border-radius: 999px;
  background: var(--bg-soft); color: var(--text);
  font-family: inherit; font-size: 13.5px; outline: none;
  transition: border-color 0.2s;
}
.nav-search input:focus { border-color: var(--accent); }
.nav-search input::placeholder { color: var(--text-muted); }
.nav-search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); color: var(--text-muted); pointer-events: none;
}
.nav-links { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.nav-link {
  font-family: 'Hey Gotcha', 'Comic Sans MS', sans-serif;
  font-size: 14px; color: var(--accent);
  padding: 6px 10px; border-radius: 8px;
  text-decoration: underline; text-underline-offset: 3px;
  text-transform: uppercase;
  transition: opacity 0.15s;
}
.nav-link:hover { opacity: 0.7; }

/* GitHub icon link */
.nav-github {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%;
  color: var(--text); transition: opacity 0.2s;
  flex-shrink: 0;
}
.nav-github:hover { opacity: 0.6; }
.nav-github svg { width: 22px; height: 22px; fill: currentColor; }

/* Theme toggle */
.theme-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px;
  border: 2px solid var(--border); border-radius: 50%;
  background: var(--bg); color: var(--text);
  cursor: pointer; flex-shrink: 0;
  transition: opacity 0.2s;
}
.theme-toggle:hover { opacity: 0.7; }
.theme-toggle svg { width: 18px; height: 18px; fill: currentColor; }

/* ── Layout ── */
.container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

.page-header { margin: 52px auto 32px; max-width: 960px; padding: 0 24px; }
.page-header h1 {
  font-family: 'Horiza', 'Archivo Black', sans-serif; font-weight: 700;
  font-size: clamp(30px, 5vw, 48px); color: var(--text); line-height: 1.1;
  letter-spacing: 1px;
}
.page-header p { color: var(--text-muted); font-size: 15.5px; margin-top: 10px; }

/* Tag filter bar */
.tag-bar {
  max-width: 960px; margin: 0 auto 36px;
  padding: 0 24px; display: flex; flex-wrap: wrap; gap: 8px;
}
.tag-filter {
  padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
  cursor: pointer; border: 2px solid var(--border); background: var(--bg-soft);
  color: var(--text-muted); transition: all 0.15s; user-select: none;
  font-family: inherit;
}
.tag-filter:hover { border-color: var(--accent); color: var(--accent); }
.tag-filter.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Featured card ── */
.featured-wrap { max-width: 960px; margin: 0 auto 36px; padding: 0 24px; }
.featured-card {
  display: grid; grid-template-columns: 1fr 1fr;
  border: 3px solid var(--border); border-radius: 14px;
  box-shadow: 7px 7px 0 var(--border);
  overflow: hidden; background: var(--card-bg);
  transition: transform 0.15s, box-shadow 0.15s; cursor: pointer;
}
.featured-card:hover { transform: translate(-3px,-3px); box-shadow: 10px 10px 0 var(--border); }
.featured-thumb {
  position: relative; min-height: 260px; overflow: hidden; background: var(--tag-bg);
}
.featured-thumb img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.thumb-placeholder {
  position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; font-size:52px; background:var(--tag-bg);
}
.featured-body { padding: 30px 28px 26px; display:flex; flex-direction:column; gap:14px; }
.featured-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent);
  font-family: 'Hey Gotcha', 'Comic Sans MS', sans-serif;
}
.featured-title {
  font-family: 'Horiza', 'Archivo Black', sans-serif; font-weight: 700;
  font-size: clamp(18px, 2.5vw, 24px); color: var(--text); line-height: 1.2;
}
.featured-excerpt { font-size: 14px; color: var(--text-body); line-height: 1.65; flex:1; }

/* Post meta */
.post-meta {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 6px; font-size: 13px; color: var(--text-muted);
}
.sep { opacity: 0.4; }
.tag {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  background: var(--tag-bg); color: var(--text-muted);
  font-size: 12px; font-weight: 700; border: 1.5px solid var(--border);
}

/* ── Post grid ── */
.post-grid-wrap { max-width: 960px; margin: 0 auto 56px; padding: 0 24px; }
.post-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 26px; }
.post-card {
  display: flex; flex-direction: column;
  border: 3px solid var(--border); border-radius: 14px;
  overflow: hidden; background: var(--card-bg);
  box-shadow: 5px 5px 0 var(--border);
  transition: transform 0.15s, box-shadow 0.15s; cursor: pointer;
}
.post-card:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 var(--border); }
.post-card-thumb {
  aspect-ratio: 16/9; overflow: hidden; background: var(--tag-bg); position: relative;
}
.post-card-thumb img { width:100%; height:100%; object-fit:cover; transition: transform 0.3s; }
.post-card:hover .post-card-thumb img { transform: scale(1.04); }
.thumb-emoji {
  position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; font-size:38px;
}
.post-card-body { padding: 16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
.post-card-title {
  font-family: 'Horiza', 'Archivo Black', sans-serif; font-weight: 700;
  font-size: 17px; color: var(--text); line-height: 1.3;
}
.post-card-excerpt { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; flex:1; }
.post-card-date { font-size: 12.5px; color: var(--text-muted); margin-top: auto; }

/* Skeletons */
.skeleton-featured {
  height: 280px; border: 3px solid var(--tag-bg); border-radius: 14px;
  background: var(--bg-soft); animation: pulse 1.4s ease-in-out infinite;
}
.skeleton-card {
  height: 260px; border: 3px solid var(--tag-bg); border-radius: 14px;
  background: var(--bg-soft); animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
.empty-state { grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--text-muted); font-size:15px; }
.empty-state strong { display:block; font-size:20px; margin-bottom:8px; color:var(--text); }

/* ── Newsletter ── */
.newsletter-wrap { max-width: 960px; margin: 0 auto 56px; padding: 0 24px; }
.newsletter-strip {
  background: var(--accent-soft); border: 3px solid var(--border);
  border-radius: 14px; box-shadow: 6px 6px 0 var(--border);
  padding: 30px 36px; display: flex; align-items: center; gap: 36px;
}
.newsletter-text { flex:1; }
.newsletter-text h3 {
  font-family: 'Horiza', 'Archivo Black', sans-serif; font-weight: 700;
  font-size: 20px; color: var(--text); margin-bottom: 6px;
}
.newsletter-text p { font-size: 14px; color: var(--text-muted); }
.newsletter-form { display:flex; gap:8px; flex-shrink:0; }
.newsletter-form input {
  padding: 9px 16px; border: 2px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font-family: inherit;
  font-size: 14px; outline: none; width: 200px; transition: border-color 0.2s;
}
.newsletter-form input:focus { border-color: var(--accent); }
.newsletter-form input::placeholder { color: var(--text-muted); }
.btn-subscribe {
  padding: 9px 20px; border: 2px solid var(--border); border-radius: 8px;
  background: var(--text); color: var(--bg); font-family: inherit;
  font-size: 14px; font-weight: 700; cursor: pointer;
  box-shadow: 3px 3px 0 var(--border);
  transition: transform 0.12s, box-shadow 0.12s;
}
.btn-subscribe:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--border); }

/* Footer */
footer {
  border-top: 2px solid var(--border); text-align: center;
  font-size: 13px; color: var(--text-muted); padding: 24px 20px;
}
footer a { color: var(--accent); }
footer a:hover { text-decoration: underline; }

/* Responsive */
@media (max-width: 700px) {
  .featured-card { grid-template-columns: 1fr; }
  .featured-thumb { min-height: 180px; aspect-ratio: 16/9; }
  .post-grid { grid-template-columns: 1fr; }
  .newsletter-strip { flex-direction: column; align-items: stretch; gap: 16px; }
  .newsletter-form { flex-direction: column; }
  .newsletter-form input { width: 100%; }
}
@media (max-width: 500px) {
  .nav-link { display: none; }
  .nav-search { display: none; }
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="/">ADEEP<span class="dot">.</span>BLOG</a>
  <div class="nav-search">
    <svg class="nav-search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="search" id="searchInput" placeholder="Search posts…" autocomplete="off" />
  </div>
  <div class="nav-links">
    <a class="nav-link" href="https://adeepag.com">Home</a>
    <!-- GitHub logo icon -->
    <a class="nav-github" href="https://github.com/adeep13" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
      </svg>

  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>
</nav>

<div class="page-header">
  <h1>THE BUILD LOG :</h1>
  <p>Writing on engineering, hardware, open-source, startups, and whatever I'm building.</p>
</div>

<div class="tag-bar" id="tagBar">
  <span class="tag-filter active" data-tag="all">All</span>
</div>

<div class="featured-wrap" id="featuredWrap">
  <div class="skeleton-featured"></div>
</div>

<div class="post-grid-wrap">
  <div class="post-grid" id="postGrid">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </div>
</div>

<div class="newsletter-wrap">
  <div class="newsletter-strip">
    <div class="newsletter-text">
      <h3>STAY IN THE LOOP :</h3>
      <p>New posts on engineering, hardware, and startups — no spam.</p>
    </div>
    <div class="newsletter-form">
      <input type="email" id="emailInput" placeholder="your@email.com" />
      <button class="btn-subscribe" id="subscribeBtn">Subscribe</button>
    </div>
  </div>
</div>

<footer>
  © <span id="footerYear"></span> Adeep AG ·
  <a href="https://adeepag.com" target="_blank" rel="noopener">adeepag.com</a> ·
  <a href="https://github.com/adeep13" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
  const POSTS_INDEX = 'posts/index.json';
  const POST_PAGE   = 'posts/post.html';

  document.getElementById('footerYear').textContent = new Date().getFullYear();

  /* ── Dark mode ── */
  const THEME_KEY = 'site-theme';
  const html = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon   = document.getElementById('themeIcon');

  function setTheme(mode) {
    if (mode === 'dark') {
      html.classList.add('dark');
      themeIcon.innerHTML = '<path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5a5 5 0 100 10 5 5 0 000-10zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>';
    } else {
      html.classList.remove('dark');
      themeIcon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
    }
    localStorage.setItem(THEME_KEY, mode);
  }

  const saved = localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  setTheme(saved);
  themeToggle.addEventListener('click', () => setTheme(html.classList.contains('dark') ? 'light' : 'dark'));

  /* ── Helpers ── */
  function fmtDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function tagsHtml(tags) {
    return (tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  }

  /* ── Render ── */
  function renderFeatured(post) {
    document.getElementById('featuredWrap').innerHTML = `
      <a href="${POST_PAGE}?slug=${post.slug}" class="featured-card">
        <div class="featured-thumb">
          ${post.image
            ? `<img src="${post.image}" alt="${post.title}" loading="lazy">`
            : `<div class="thumb-placeholder">${post.emoji || '⚡'}</div>`}
        </div>
        <div class="featured-body">
          <span class="featured-label">✦ Featured Post</span>
          <h2 class="featured-title">${post.title}</h2>
          <p class="featured-excerpt">${post.excerpt || ''}</p>
          <div class="post-meta">
            <span>Adeep AG</span>
            ${post.reading_time ? `<span class="sep">·</span><span>${post.reading_time} min read</span>` : ''}
            ${tagsHtml(post.tags)}
          </div>
        </div>
      </a>`;
  }

  function renderGrid(posts) {
    const grid = document.getElementById('postGrid');
    if (!posts.length) {
      grid.innerHTML = `<div class="empty-state"><strong>No posts yet</strong>Check back soon!</div>`;
      return;
    }
    grid.innerHTML = posts.map(post => `
      <a href="${POST_PAGE}?slug=${post.slug}" class="post-card">
        <div class="post-card-thumb">
          ${post.image
            ? `<img src="${post.image}" alt="${post.title}" loading="lazy">`
            : `<div class="thumb-emoji">${post.emoji || '📝'}</div>`}
        </div>
        <div class="post-card-body">
          <div class="post-meta">
            ${tagsHtml(post.tags)}
            ${post.reading_time ? `<span class="sep">·</span><span>${post.reading_time} min read</span>` : ''}
          </div>
          <h3 class="post-card-title">${post.title}</h3>
          <p class="post-card-excerpt">${post.excerpt || ''}</p>
          <div class="post-card-date">${fmtDate(post.date)}</div>
        </div>
      </a>`).join('');
  }

  /* ── Filter state ── */
  let allPosts = [];
  let activeTag = 'all';

  function buildTagBar(posts) {
    const allTags = [...new Set(posts.flatMap(p => p.tags || []))].sort();
    const bar = document.getElementById('tagBar');
    bar.innerHTML = `<span class="tag-filter active" data-tag="all">All</span>` +
      allTags.map(t => `<span class="tag-filter" data-tag="${t.toLowerCase()}">${t}</span>`).join('');
    bar.querySelectorAll('.tag-filter').forEach(el => {
      el.addEventListener('click', () => {
        bar.querySelectorAll('.tag-filter').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        activeTag = el.dataset.tag;
        applyFilters();
      });
    });
  }

  function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const featured = allPosts[0];
    let rest = allPosts.length > 1 ? allPosts.slice(1) : allPosts;

    if (activeTag !== 'all') {
      rest = rest.filter(p => (p.tags || []).map(t => t.toLowerCase()).includes(activeTag));
    }
    if (q) {
      rest = rest.filter(p => (p.title + ' ' + (p.excerpt || '')).toLowerCase().includes(q));
    }
    renderGrid(rest);

    if (featured) {
      const tagOk = activeTag === 'all' || (featured.tags || []).map(t => t.toLowerCase()).includes(activeTag);
      const qOk   = !q || (featured.title + ' ' + (featured.excerpt || '')).toLowerCase().includes(q);
      document.getElementById('featuredWrap').style.display = (tagOk && qOk) ? '' : 'none';
    }
  }

  /* ── Load ── */
  async function loadPosts() {
    try {
      const res = await fetch(`${POSTS_INDEX}?v=${Date.now()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const posts = await res.json();

      allPosts = posts;
      buildTagBar(posts);

      if (posts.length > 0) {
        renderFeatured(posts[0]);
        renderGrid(posts.length > 1 ? posts.slice(1) : posts);
      } else {
        document.getElementById('featuredWrap').innerHTML = '';
        renderGrid([]);
      }
    } catch (err) {
      document.getElementById('featuredWrap').innerHTML = '';
      document.getElementById('postGrid').innerHTML = `
        <div class="empty-state">
          <strong>Couldn't load posts</strong>
          Make sure <code>posts/index.json</code> exists in the repo.
        </div>`;
    }
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);

  document.getElementById('subscribeBtn').addEventListener('click', () => {
    const email = document.getElementById('emailInput').value.trim();
    if (!email || !email.includes('@')) { document.getElementById('emailInput').focus(); return; }
    alert('Thanks! Newsletter coming soon.');
    document.getElementById('emailInput').value = '';
  });

  loadPosts();
</script>
</body>
</html>
