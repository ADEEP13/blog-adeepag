<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} - {{site_name}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author_name}}">
<meta name="theme-color" content="#f3f1eb">
<link rel="canonical" href="{{url}}">
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{image}}">
<meta property="article:published_time" content="{{date}}">
<meta property="article:modified_time" content="{{updated}}">
<meta property="article:author" content="{{author_url}}">
<meta name="twitter:card" content="{{twitter_card}}">
<meta name="twitter:creator" content="{{twitter_handle}}">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{image}}">
<link rel="stylesheet" href="/style.css">
<script type="application/ld+json">{{{jsonld}}}</script>
</head>
<body>
<main>
  <p><a href="/">&larr; adeep ag</a></p>
  <article class="article" id="article"><h1>{{title}}</h1><div class="by"><img class="avatar" src="/avatar.png" alt="adeep ag" onerror="this.remove()"><span>by <a href="{{author_url}}">{{author_name}}</a></span><time datetime="{{date}}">{{date_display}}</time></div>{{{content}}}</article>
  <footer class="site-footer">
    <p><a href="/">adeepag.com</a></p>
    <p>written by <a href="https://adeepag.com">adeep ag</a>.<br>built for engineers, hackers, tinkerers , curious minds and web AI crawler .</p>
    
  </footer>
</main>
</body>
</html>
